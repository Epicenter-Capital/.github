name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to test against
        type: string
        default: "3.13"
      install:
        description: Dependency install mode ("uv" for uv.lock, "pip" for requirements.txt)
        type: string
        default: uv
      lint:
        description: Run ruff check
        type: boolean
        default: false
      pytest-args:
        description: Arguments passed to pytest
        type: string
        default: -q -m "not integration"
      apt-packages:
        description: Space-separated apt packages the tests need (e.g. ffmpeg)
        type: string
        default: ""
      extra-pip:
        description: Space-separated extra packages installed into the test env (bridge until they're added to the repo's own dependencies)
        type: string
        default: ""
      test-env:
        description: Newline-separated KEY=VALUE pairs exported before running tests (dummy values for required Settings fields, never real secrets)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        if: inputs.install == 'uv'
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: ${{ inputs.install == 'pip' && 'pip' || '' }}

      - name: Install dependencies (uv)
        if: inputs.install == 'uv'
        run: uv sync --frozen --all-extras --dev

      - name: Install dependencies (pip)
        if: inputs.install == 'pip'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install system packages
        if: inputs.apt-packages != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ${{ inputs.apt-packages }}

      - name: Install extra test packages
        if: inputs.extra-pip != ''
        run: |
          if [ "${{ inputs.install }}" = "uv" ]; then
            uv pip install ${{ inputs.extra-pip }}
          else
            pip install ${{ inputs.extra-pip }}
          fi

      - name: Ensure pytest is available
        run: |
          if [ "${{ inputs.install }}" = "uv" ]; then
            uv run --no-sync python -c "import pytest" 2>/dev/null || uv pip install pytest
          else
            python -c "import pytest" 2>/dev/null || pip install pytest
          fi

      - name: Set test environment
        if: inputs.test-env != ''
        run: printf '%s\n' "${{ inputs.test-env }}" >> "$GITHUB_ENV"

      - name: Lint
        if: inputs.lint
        run: |
          # Prefer the repo's own pinned ruff so results match local runs;
          # fall back to an isolated latest ruff only when it isn't a dependency.
          if [ "${{ inputs.install }}" = "uv" ]; then
            if uv run --no-sync ruff --version >/dev/null 2>&1; then
              uv run --no-sync ruff check .
            else
              uvx ruff check .
            fi
          else
            if command -v ruff >/dev/null 2>&1; then
              ruff check .
            else
              pipx run ruff check .
            fi
          fi

      - name: Test
        run: |
          if [ "${{ inputs.install }}" = "uv" ]; then
            uv run --no-sync pytest ${{ inputs.pytest-args }}
          else
            pytest ${{ inputs.pytest-args }}
          fi
